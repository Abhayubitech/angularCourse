<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <form
    class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 space-y-6"
    [formGroup]="form"
  >
    <h2 appBgColor class="text-2xl font-semibold text-gray-800 text-center">
      Create Account
    </h2>

    <!-- Name -->
    <div appBgColor >
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Name
      </label>
      <input
      formControlName="name"
        type="text"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="John Doe"
      />
   @if (
  form.controls['name'].errors?.['required'] &&
  (form.controls['name'].touched || form.controls['name'].dirty)
) {
  <p appBgColor class="text-sm text-red-500 mt-1">
    Name is required
  </p>
}

    </div>

    <!-- Email -->
    <div appBgColor>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input
         formControlName="email"
        type="email"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="email@example.com"
      />
      <p class="text-sm text-red-500 mt-1 hidden">
        Enter a valid email
      </p>
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Password
      </label>
      <input
         formControlName="password"
        type="password"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="••••••••"
      />
      <p class="text-sm text-red-500 mt-1 hidden">
        Minimum 6 characters
      </p>
    </div>
     <!-- Gender -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Gender
      </label>

      <div class="flex items-center gap-6">
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input
            type="radio"
            formControlName="gender"
            value="male"
            class="text-blue-600 focus:ring-blue-500"
          />
          Male
        </label>

        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input
            type="radio"
            formControlName="gender"
            value="female"
            class="text-blue-600 focus:ring-blue-500"
          />
          Female
        </label>

        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input
            type="radio"
            formControlName="gender"
            value="other"
            class="text-blue-600 focus:ring-blue-500"
          />
          Other
        </label>
      </div>

      <p class="text-sm text-red-500 mt-1 hidden">
        Gender is required
      </p>
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition"
      (click)="submit()"
    >
      Submit
    </button>
  </form>
</div>
